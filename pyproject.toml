[project]
name = "search-engine"
version = "0.1.0"
description = "A Python search engine built from scratch for indexing and retrieving Reddit and arXiv documents."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "arxiv>=4.0.1",
    "python-dotenv>=1.0",
    "praw>=8.0.3",
    "pandas>=3.0",
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pdoc>=16.0.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.16,<0.13"]
build-backend = "uv_build"
